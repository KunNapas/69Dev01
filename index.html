<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบรับสมัครนักเรียน นักศึกษา</title>
   
</head>

<body>
    <center>
        <h1>Version1 Create website </h1>
        <p>ยินดีต้อนรับเข้าสู่เว็บไซต์ของเรา</p>
        <p>เว็บไซต์ตัวอย่างสำหรับฝึกใช้งาน Git</p>
    </center>
 <center>
    <form>
        <label>ชื่อ-สกุล</label><br>
        <input type="text" name="st_name" placeholder="ป้อนชื่อ-สกุล">
        <br><br>

        <label>ระดับชั้นที่ต้องการสมัคร</label><br>
        <input type="radio" name="level" value="ปวช.">
        <label>ปวช.</label>
        <input type="radio" name="level" value="ปวส.">
        <label>ปวส.</label>
        <br><br>

        <label>สาขาวิชา</label><br>
        <select name="major">
            <option value="การบัญชี">การบัญชี</option>
            <option value="การตลาด">การตลาด</option>
            <option value="เทคโนโลยีสารสนเทศ">เทคโนโลยีสารสนเทศ</option>
        </select>
        <br>
        <button type="submit">สมัครเรียน</button>
        <button type="reset">ล้างข้อมูล</button>
    </form>
    </center>
</body>
</html>
